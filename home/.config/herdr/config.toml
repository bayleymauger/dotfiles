onboarding = false

[terminal]
default_shell = "/bin/zsh"

[keys]
focus_agent = "prefix+alt+1..9"

# Toggle the herdr-reviewr code-review pane (persiyanov/herdr-reviewr)
[[keys.command]]
key = "cmd+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"

[theme]
name = "rose-pine"

[theme.custom]
sidebar_bg = "transparent"
panel_bg = "transparent"
surface0 = "transparent"
surface1 = "transparent"
active_row_bg = "transparent"
